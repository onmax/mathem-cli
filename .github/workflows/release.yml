name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.15.0
        with:
          node-version: 24
          run-install: false
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp pm pack --out mathem-cli.tgz
      - run: vp test run
      - run: |
          tar -tzf mathem-cli.tgz | grep -qx package/dist/mathem.mjs
          npx --yes --package "$PWD/mathem-cli.tgz" mathem --help
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: package
          path: mathem-cli.tgz

  publish:
    needs: verify
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: package
          path: .
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: |
          version="${GITHUB_REF_NAME#v}"
          remote_sha=$(npm view "mathem-cli@$version" dist.shasum 2>/dev/null || true)
          if test -n "$remote_sha"; then
            test "$remote_sha" = "$(sha1sum mathem-cli.tgz | cut -d ' ' -f 1)"
          else
            npm publish ./mathem-cli.tgz
          fi

  github-release:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
